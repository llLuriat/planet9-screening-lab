bias_model: h_prior_from_catalog
bias_model_level: 1
blocker_if_none: false
max_evidence_level_without_bias_model: weak
# Depth/tracking-arc/sky-coverage factors (Napier et al. 2021 design, arXiv:2102.05601 §3)
limiting_magnitude_v: 24.5
sky_coverage_deg2: 20000.0
min_tracking_arc_years: 2.0
n_synthetic: 5000
# H-prior from JPL SBDB (data/etnos/h_values.csv); per-object depth probability
# uses the OSSOS quadratic-logistic efficiency curve evaluated at the apparent
# magnitude V = H + 5 log10(r·Δ). Source: NASA/JPL SBDB API, queried 2026-09-07.
h_catalog_path: data/etnos/h_values.csv
# q-prior from the real ETNO catalog (perihelion distance q = a(1-e)); synthetic
# objects draw q from this distribution to match the real sample's heliocentric
# geometry. Source: data/etnos/catalog_validated.csv.
q_prior_catalog_path: data/etnos/catalog_validated.csv
# Assumed geometric albedo for diameter estimation. Source: Sheppard & Trujillo
# (2016), AJ 152:221 — moderate albedo used in that paper to estimate ETNO
# diameters from H in the absence of direct measurement.
# Published: https://iopscience.iop.org/article/10.3847/1538-3881/152/6/221
# Preprint: https://arxiv.org/pdf/1608.08772
albedo_default: 0.10
# OSSOS quadratic-logistic efficiency curve parameters (Bannister et al. 2018,
# ApJS 236:18, arXiv:1805.11740, §5.2, Table 2; Bannister et al. 2016a, ApJ 831:94).
# η(m) = (eff_max - c·(m-21)²) / (1 + exp((m - m0)/sig)).
# Source: data/etnos/ossos_efficiency_attribution.md
ossos_efficiency_params:
  eff_max: 0.887741923
  c: 0.0276305359
  m0: 24.1423416
  sig: 0.153656587

# OSSOS footprint blocks for real point-in-polygon sky filtering.
# When enabled, apply_selection_function checks each synthetic object's
# (ra_deg, dec_deg) against the real OSSOS 2013A footprint polygons
# (Bannister et al. 2018, Fig. 1).
#
# use_ossos_footprint: false is the DEFAULT ON PURPOSE. The OSSOS 2013A
# footprint covers only ~0.07% of the celestial sphere, so auto-enabling
# this filter would collapse the surviving synthetic sample to a handful
# of objects, making the resulting R comparison degenerate and silently
# changing the interpretation of default runs. There is also a declared
# epoch tension: the blocks are 2013A pointings while the synthetic sky
# positions are projected at the catalog epoch 2014-05-23 (see
# docs/LIMITACOES.md). Since 2026-09-26 the synthetic sky positions
# (ra_deg/dec_deg) ARE real orbital->sky projections (integrated
# planet9lab/geometry/sky_projection.py), so enabling this flag now
# exercises real positions - but the coverage/epoch caveats above still
# make it opt-in. Enable it explicitly only when you specifically want
# to exercise the real-footprint geometry path.
use_ossos_footprint: false
ossos_footprint_blocks: null
