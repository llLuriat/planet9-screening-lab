# Secular-timescale budget (V2, item 1 of the V1->V2 plan).
#
# integration_years
# ------------------
# The article claims need 1e8-4e9 yr to validate long-term apsidal alignment.
# Benchmarked via scripts/benchmark_integration_cost.py on 2026-08-11 (see
# results/hardware_benchmark.json): 4e9 yr costs ~12.4h per candidate control
# pair and ~62h (2.6 days) for the full 7-candidate set on the benchmark
# machine, comfortably inside the 48h/pair budget the script assumes.
#
# NOTE ON HARDWARE: this benchmark ran on the development machine, not the
# machine that will execute the production `screen` run (a faster machine,
# per project notes). Since the benchmark machine already clears the 48h/pair
# budget at 4e9 yr, a faster production machine is expected to do the same or
# better - but this has NOT been independently re-measured on the production
# machine. Before citing wall-clock numbers in the article, re-run
# scripts/benchmark_integration_cost.py on the actual production machine and
# update this comment + docs/LIMITACOES.md with those numbers instead.
integration_years: 4000000000  # 4e9 yr, validated feasible per results/hardware_benchmark.json (see note above)
# timestep_years
# --------------
# Derived, not guessed: dt = P_Jupiter / 20, where P_Jupiter is computed from
# Jupiter's semi-major axis in data/solar_system/giants_epoch.csv
# (a = 5.2044 AU -> P = sqrt(a^3) = 11.8729 yr in these units, since
# sim.G = 4*pi^2 with mass in Msun, distance in AU, time in yr).
# 11.8729 / 20 = 0.593644 yr. Jupiter is the fastest body in the integrated
# system (giants + P9 candidate + ETNOs); the P9 candidate and ETNOs orbit far
# more slowly and do not set the timestep requirement. See
# planet9lab.physics.recommended_timestep_years(), which computes this same
# value programmatically from the giants catalog so this file and the code
# cannot silently drift apart - a test asserts they match.
timestep_years: 0.593644
# checkpoint_interval_years
# --------------------------
# At 4e9 yr / 0.593644 yr per step ~= 6.74e9 timesteps per branch. This is a
# long-running integration; checkpointing every 1e6 yr (~4000 checkpoints over
# the full run) bounds the amount of work lost to a crash/interruption to at
# most ~1e6/4e9 = 0.025% of the run, while keeping checkpoint I/O overhead
# small relative to integration cost.
checkpoint_interval_years: 1000000
seeds: [12345]
integrator: whfast
max_candidates: 7